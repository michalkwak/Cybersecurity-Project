<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Log in</title></head>
<body>
    <h1>Log in</h1>
    {% if error %}<p>{{ error }}</p>{% endif %}
    <form method="post">
        <!-- Flaw 6 - Missing CSRF token

        The CSRF token protects the POST form from Cross-Site
        Request Forgery attacks. Without it, an attacker could
        potentially create a malicious page that sends a request
        to this application using a victim's browser.

        Fix: Add {% csrf_token %} inside the form -->

        <!-- {% csrf_token %} -->
        <input type="text" name="username" placeholder="Username"><br>
        <input type="password" name="password" placeholder="Password"><br>
        <button type="submit">Log in</button>
    </form>
    <p><a href="{% url 'register' %}">Register</a></p>
</body>
</html>
